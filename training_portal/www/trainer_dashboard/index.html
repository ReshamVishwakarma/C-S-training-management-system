{% extends "templates/web.html" %}

{% block page_content %}
<style>
.dashboard-header{
    background:#1f4d7a;
    color:white;
    padding:30px;
    border-radius:12px;
    margin-bottom:25px;
}

.dashboard-header h2,
.dashboard-header p{
    color:white;
}

.stat-card{
    border:none;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.stat-card:hover{
    transform:translateY(-3px);
}

.stat-number{
    font-size:2rem;
    font-weight:700;
}

.page-container{
    background:#f4f6fb;
    min-height:100vh;
    padding-top:20px;
}
</style>
<div class="page-container">
<div class="container mt-4">

    <div class="dashboard-header">
        <h2>Trainer Dashboard</h2>
        <p>Welcome {{ user }}</p>
    </div>

    <div class="row">

        <div class="col-md-3">
            <div class="card stat-card p-3 text-center">
                <div class="stat-number text-primary">8</div>
                <div>Assigned Trainings</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3 text-center">
                <div class="stat-number text-success">3</div>
                <div>Today's Sessions</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3 text-center">
                <div class="stat-number text-warning">120</div>
                <div>Trainees</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card p-3 text-center">
                <div class="stat-number text-danger">95%</div>
                <div>Attendance Submitted</div>
            </div>
        </div>

    </div>

</div>
</div>

{% endblock %}
