<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&S Electric LMS — Create Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f8fafc; 
            padding: 24px;
        }
        .login-card { 
            max-width: 460px; 
            width: 100%; 
            padding: 40px; 
            border-radius: 16px; 
            background: white; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }
        .logo-img {
            height: 70px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .system-title {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        h2 { 
            font-size: 24px; 
            font-weight: 800; 
            color: #0f172a; 
            margin-bottom: 6px; 
            letter-spacing: -0.5px; 
        }
        .subtitle { 
            color: #64748b; 
            margin-bottom: 28px; 
            font-size: 14.5px; 
        }
        .form-label { 
            font-weight: 600; 
            color: #334155; 
            font-size: 13px; 
            margin-bottom: 6px; 
        }
        .form-control { 
            border-radius: 8px; 
            padding: 11px 14px; 
            border: 1.5px solid #cbd5e1; 
            font-size: 14px; 
        }
        .form-control:focus { 
            border-color: #3b82f6; 
            box-shadow: none; 
        }
        .btn-login { 
            background: #0f172a; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 12px; 
            font-weight: 600; 
            width: 100%; 
            margin-top: 16px; 
            font-size: 15px; 
            transition: all 0.2s ease; 
        }
        .btn-login:hover { 
            background: #1e293b; 
        }
        .error-msg { 
            color: #ef4444; 
            font-size: 0.85rem; 
            margin-top: 8px; 
            display: none; 
            font-weight: 600; 
            text-align: center;
        }
        .success-msg { 
            color: #10b981; 
            font-size: 0.85rem; 
            margin-top: 8px; 
            display: none; 
            font-weight: 600; 
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Header -->
    <div class="text-center">
        <img src="/assets/training_portal/logo.png" alt="C&S Electric Logo" class="logo-img">
        <div class="system-title">Learning & Competency Management System</div>
        <h2>Create Password</h2>
        <p class="subtitle">Set a secure password for your account.</p>
    </div>

    <!-- Create Password Form -->
    <div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="new_password" class="form-control" placeholder="••••••••">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-control" placeholder="••••••••">
        </div>
        
        <div class="error-msg" id="error_msg"></div>
        <div class="success-msg" id="success_msg"></div>
        
        <button class="btn-login" onclick="doCreatePassword()">Create Password</button>
    </div>
</div>

<script>
const email = "{{ email }}";

function doCreatePassword() {
    const password = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorMsg = document.getElementById('error_msg');
    const successMsg = document.getElementById('success_msg');
    const createBtn = document.querySelector('.btn-login');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!password || !confirmPassword) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Please enter both password fields.';
        return;
    }

    if (password !== confirmPassword) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Passwords do not match.';
        return;
    }

    if (password.length < 8) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Password must be at least 8 characters long.';
        return;
    }

    // Basic password strength: must contain at least one letter and one number
    const hasLetter = /[a-zA-Z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    if (!hasLetter || !hasNumber) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Password must contain at least one letter and one number.';
        return;
    }

    createBtn.disabled = true;
    createBtn.textContent = 'Creating...';

    fetch("/api/method/training_portal.training_portal.access_control.setup_user_password", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(response => {
        return response.json().then(data => {
            if (!response.ok) {
                return Promise.reject(data);
            }
            return data;
        });
    })
    .then(data => {
        if (data.message && data.message.status === 'success') {
            successMsg.style.display = 'block';
            successMsg.textContent = 'Password created successfully! Redirecting to login...';
            setTimeout(() => {
                window.location.href = '/training-portal/login';
            }, 2000);
        } else {
            throw new Error('Password creation failed.');
        }
    })
    .catch(err => {
        createBtn.disabled = false;
        createBtn.textContent = 'Create Password';
        errorMsg.style.display = 'block';
        
        if (err && err._server_messages) {
            try {
                const msgs = JSON.parse(err._server_messages);
                const msg = JSON.parse(msgs[0]).message;
                errorMsg.textContent = msg;
            } catch(e) {
                errorMsg.textContent = 'Password creation failed. Please try again.';
            }
        } else if (err && err.exception) {
            errorMsg.textContent = err.exception;
        } else {
            errorMsg.textContent = 'Password creation failed. Please try again.';
        }
    });
}
</script>
</body>
</html>
