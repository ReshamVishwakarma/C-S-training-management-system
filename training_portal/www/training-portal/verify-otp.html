<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Portal — OTP Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; align-items: center; justify-content: center; }
        .verification-card { max-width: 480px; width: 100%; padding: 40px; border-radius: 16px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .logo { font-size: 1.2rem; font-weight: 700; color: #0f172a; margin-bottom: 24px; text-align: center; }
        .logo span { display: block; font-size: 0.85rem; font-weight: 500; color: #64748b; }
        h3 { font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { color: #64748b; text-align: center; margin-bottom: 28px; font-size: 14.5px; line-height: 1.5; }
        .form-control-otp { letter-spacing: 12px; text-align: center; font-size: 28px; font-weight: 800; border-radius: 10px; padding: 12px; border: 1.5px solid #cbd5e1; color: #0f172a; }
        .form-control-otp:focus { border-color: #3b82f6; box-shadow: none; }
        .btn-verify { background: #0f172a; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; margin-top: 20px; font-size: 15px; transition: all 0.2s ease; }
        .btn-verify:hover { background: #1e293b; }
        .timer-info { text-align: center; font-size: 13.5px; color: #64748b; margin-top: 16px; font-weight: 500; }
        .timer-countdown { color: #ef4444; font-weight: 700; }
        .resend-container { text-align: center; margin-top: 20px; font-size: 13.5px; font-weight: 600; }
        .resend-btn { color: #3b82f6; text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; }
        .resend-btn:hover { text-decoration: underline; }
        .resend-btn:disabled { color: #94a3b8; cursor: not-allowed; text-decoration: none; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; text-align: center; display: none; font-weight: 600; }
        .success-msg { color: #10b981; font-size: 0.85rem; margin-top: 8px; text-align: center; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="verification-card">
    <div class="logo">
        C&S Electric Ltd.
        <span>Learning & Competency Management</span>
    </div>

    <h3>Enter OTP Verification Code</h3>
    <p class="subtitle">We've sent a 6-digit verification code to <b id="display-email">{{ email }}</b>.<br>Please enter the code to complete your login as <b>{{ role }}</b>.</p>

    <div>
        <input type="text" id="otp" class="form-control form-control-otp mb-2" maxlength="6" placeholder="000000" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        
        <div class="error-msg" id="error_msg"></div>
        <div class="success-msg" id="success_msg"></div>

        <button class="btn-verify" onclick="doVerify()">Verify Code</button>
        
        <div class="timer-info">
            Code expires in: <span class="timer-countdown" id="timer">05:00</span>
        </div>

        <div class="resend-container">
            Didn't receive the code? <button id="resend_btn" class="resend-btn" onclick="doResend()" disabled>Resend OTP</button>
        </div>
        
        <div class="text-center mt-3">
            <a href="/training-portal/login" style="color: #64748b; font-weight: 600; font-size: 13.5px; text-decoration: none;"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</div>

<script>
const email = "{{ email }}";
const role = "{{ role }}";
let duration = 300; // 5 minutes in seconds
let timerInterval;

function startTimer() {
    clearInterval(timerInterval);
    const timerDisplay = document.getElementById('timer');
    const resendBtn = document.getElementById('resend_btn');
    resendBtn.disabled = true;

    timerInterval = setInterval(() => {
        let minutes = Math.floor(duration / 60);
        let seconds = duration % 60;

        minutes = String(minutes).padStart(2, '0');
        seconds = String(seconds).padStart(2, '0');

        timerDisplay.textContent = `${minutes}:${seconds}`;

        if (--duration < 0) {
            clearInterval(timerInterval);
            timerDisplay.textContent = "00:00";
            resendBtn.disabled = false;
            document.getElementById('error_msg').style.display = 'block';
            document.getElementById('error_msg').textContent = "OTP code has expired. Please click Resend OTP.";
        }
    }, 1000);
}

function doVerify() {
    const otp = document.getElementById('otp').value.trim();
    const errorMsg = document.getElementById('error_msg');
    const successMsg = document.getElementById('success_msg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!otp || otp.length !== 6) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = "Please enter a valid 6-digit OTP code.";
        return;
    }

    const verifyBtn = document.querySelector('.btn-verify');
    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verifying...";

    fetch("/api/method/training_portal.training_portal.access_control.verify_login_otp", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            email: email,
            otp: otp
        })
    })
    .then(response => {
        return response.json().then(data => {
            if (!response.ok) {
                return Promise.reject(data);
            }
            return data;
        });
    })
    .then(data => {
        if (data.message && data.message.status === 'success') {
            successMsg.style.display = 'block';
            successMsg.textContent = "Verification successful! Logging in...";
            setTimeout(() => {
                window.location.href = data.message.redirect_url;
            }, 1000);
        } else {
            throw new Error('Verification failed.');
        }
    })
    .catch(err => {
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify Code";
        errorMsg.style.display = 'block';
        
        if (err && err._server_messages) {
            try {
                const msgs = JSON.parse(err._server_messages);
                const msg = JSON.parse(msgs[0]).message;
                errorMsg.textContent = msg;
            } catch(e) {
                errorMsg.textContent = "OTP verification failed. Please try again.";
            }
        } else if (err && err.exception) {
            errorMsg.textContent = err.exception;
        } else {
            errorMsg.textContent = "OTP verification failed. Please try again.";
        }
    });
}

function doResend() {
    const errorMsg = document.getElementById('error_msg');
    const successMsg = document.getElementById('success_msg');
    const resendBtn = document.getElementById('resend_btn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    resendBtn.disabled = true;

    fetch("/api/method/training_portal.training_portal.access_control.resend_login_otp", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            email: email,
            selected_role: role
        })
    })
    .then(response => {
        return response.json().then(data => {
            if (!response.ok) {
                return Promise.reject(data);
            }
            return data;
        });
    })
    .then(data => {
        if (data.message && data.message.status === 'success') {
            successMsg.style.display = 'block';
            successMsg.textContent = "A new OTP code has been sent to your email.";
            duration = 300;
            startTimer();
        } else {
            throw new Error('Resend failed.');
        }
    })
    .catch(err => {
        resendBtn.disabled = false;
        errorMsg.style.display = 'block';
        
        if (err && err._server_messages) {
            try {
                const msgs = JSON.parse(err._server_messages);
                const msg = JSON.parse(msgs[0]).message;
                errorMsg.textContent = msg;
            } catch(e) {
                errorMsg.textContent = "Resend OTP failed. Please try logging in again.";
            }
        } else {
            errorMsg.textContent = "Resend OTP failed. Please try logging in again.";
        }
    });
}

document.addEventListener("DOMContentLoaded", () => {
    if (!email || !role) {
        window.location.href = "/training-portal/login";
        return;
    }
    startTimer();
});
</script>
</body>
</html>
