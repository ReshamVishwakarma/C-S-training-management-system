<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Portal — Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; align-items: center; justify-content: center; }
        .reset-card { max-width: 480px; width: 100%; padding: 40px; border-radius: 16px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .logo { font-size: 1.2rem; font-weight: 700; color: #0f172a; margin-bottom: 24px; text-align: center; }
        .logo span { display: block; font-size: 0.85rem; font-weight: 500; color: #64748b; }
        h3 { font-weight: 800; color: #0f172a; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { color: #64748b; text-align: center; margin-bottom: 28px; font-size: 14.5px; line-height: 1.5; }
        .form-label { font-weight: 600; color: #334155; font-size: 13.5px; margin-bottom: 6px; display: block; }
        .form-control { border-radius: 8px; padding: 11px 14px; border: 1.5px solid #cbd5e1; font-size: 14px; }
        .form-control:focus { border-color: #3b82f6; box-shadow: none; }
        .btn-reset { background: #0f172a; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; margin-top: 16px; font-size: 15px; transition: all 0.2s ease; }
        .btn-reset:hover { background: #1e293b; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; text-align: center; display: none; font-weight: 600; }
        .success-msg { color: #10b981; font-size: 0.85rem; margin-top: 8px; text-align: center; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="logo">
        C&S Electric Ltd.
        <span>Learning & Competency Management</span>
    </div>

    <h3>Forgot Password?</h3>
    <p class="subtitle">Enter your registered email address and we'll send you a 6-digit OTP code to reset your password.</p>

    <div>
        <div class="mb-3">
            <label class="form-label">Corporate Email Address</label>
            <input type="email" id="email" class="form-control w-100" placeholder="you@cselectric.com">
        </div>
        
        <div class="error-msg" id="error_msg"></div>
        <div class="success-msg" id="success_msg"></div>

        <button class="btn-reset" onclick="requestReset()">Send OTP Code</button>
        
        <div class="text-center mt-4">
            <a href="/training-portal/login" style="color: #64748b; font-weight: 600; font-size: 13.5px; text-decoration: none;"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</div>

<script>
function requestReset() {
    const email = document.getElementById('email').value.trim();
    const errorMsg = document.getElementById('error_msg');
    const successMsg = document.getElementById('success_msg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!email) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = "Please enter your email address.";
        return;
    }

    frappe.call({
        method: "training_portal.training_portal.access_control.request_password_reset",
        args: {
            email: email
        },
        callback: function(r) {
            if (r.message && r.message.status === 'success') {
                successMsg.style.display = 'block';
                successMsg.textContent = "OTP code has been sent! Redirecting to password reset page...";
                setTimeout(() => {
                    window.location.href = `/training-portal/reset-password?email=${encodeURIComponent(email)}`;
                }, 1500);
            }
        },
        error: function(err) {
            errorMsg.style.display = 'block';
            if (err._server_messages) {
                const msgs = JSON.parse(err._server_messages);
                const msg = JSON.parse(msgs[0]).message;
                errorMsg.textContent = msg;
            } else {
                errorMsg.textContent = "Could not find a user with this email address.";
            }
        }
    });
}
</script>
</body>
</html>
