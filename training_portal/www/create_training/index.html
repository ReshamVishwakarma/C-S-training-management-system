{% extends "training_portal/templates/trainer_base.html" %}

{% block content_area %}
<style>
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
    }

    .form-control, .form-select {
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        font-size: 14px;
        background-color: var(--bg-card);
        color: var(--text-main);
        transition: all 0.2s ease;
        width: 100%;
    }

    .form-control:focus, .form-select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-control:disabled, .form-select:disabled {
        background-color: #f1f5f9;
        cursor: not-allowed;
    }

    .btn-submit {
        background-color: var(--accent);
        color: white;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 10px;
        border: none;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .btn-submit:hover {
        background-color: var(--accent-hover);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
</style>

<!-- Navigation Back -->
<a href="/trainer_dashboard" class="btn btn-sm btn-outline-secondary mb-4" style="border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
    <i class="bi bi-arrow-left"></i> Back to Dashboard
</a>

<!-- Page Header -->
<div class="page-header-widget">
    <div class="page-title-group">
        <h1>Schedule Training Session</h1>
        <p>Define a new training schedule and delivery parameters</p>
    </div>
</div>

<div class="lms-card">
    <form id="create-session-form" onsubmit="submitSessionForm(event)">
        <!-- Course Selection & Description -->
        <div class="form-grid">
            <div class="form-group" style="grid-column: span 2;">
                <label for="course_select">Training Course *</label>
                <select id="course_select" class="form-select" required onchange="onCourseChange()">
                    <option value="">-- Choose Course Template --</option>
                    {% for course in courses %}
                        <option value="{{ course.name }}">{{ course.course_name }} ({{ course.duration_hours }} Hours)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="trainer_select">Conducting Trainer *</label>
                <select id="trainer_select" class="form-select" required>
                    {% for t in trainers %}
                        <option value="{{ t.name }}" {% if trainer and trainer.name == t.name %}selected{% endif %}>{{ t.trainer_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Date & Time Settings -->
        <div class="form-grid">
            <div class="form-group">
                <label for="training_date">Scheduled Date *</label>
                <input type="date" id="training_date" class="form-control" required min="{{ today }}">
            </div>
            <div class="form-group">
                <label for="start_time">Start Time *</label>
                <input type="time" id="start_time" class="form-control" required onchange="calculateDuration()">
            </div>
            <div class="form-group">
                <label for="end_time">End Time *</label>
                <input type="time" id="end_time" class="form-control" required onchange="calculateDuration()">
            </div>
            <div class="form-group">
                <label for="duration_hours">Calculated Duration (Hours)</label>
                <input type="number" id="duration_hours" class="form-control" step="0.01" readonly style="background-color: #f8fafc;">
            </div>
        </div>

        <!-- Mode & Venue Settings -->
        <div class="form-grid">
            <div class="form-group">
                <label for="training_mode">Training Mode *</label>
                <select id="training_mode" class="form-select" required onchange="toggleModeFields()">
                    <option value="Online">Online Delivery</option>
                    <option value="Offline">Offline / Classroom Delivery</option>
                </select>
            </div>
            <div class="form-group" id="meeting-link-wrapper" style="grid-column: span 2;">
                <label for="meeting_link">Online Meeting Link</label>
                <input type="url" id="meeting_link" class="form-control" placeholder="https://teams.microsoft.com/...">
            </div>
            <div class="form-group d-none" id="location-wrapper" style="grid-column: span 2;">
                <label for="location">Offline Venue / Classroom Location</label>
                <input type="text" id="location" class="form-control" placeholder="Conference Room B, 3rd Floor...">
            </div>
            <div class="form-group">
                <label for="max_participants">Max Participants Limit</label>
                <input type="number" id="max_participants" class="form-control" value="0" min="0">
            </div>
        </div>

        <!-- Description -->
        <div class="form-group mb-4">
            <label for="description">Session Notes / Outline Description</label>
            <textarea id="description" class="form-control" rows="4" placeholder="Course outline, requirements, or trainer remarks..."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-3">
            <a href="/trainer_dashboard" class="btn btn-outline-secondary" style="border-radius: 10px; padding: 12px 24px; font-weight: 600;">Cancel</a>
            <button type="submit" class="btn-submit">Schedule Session</button>
        </div>
    </form>
</div>

<script>
    // Embed course metadata for client side pre-filling
    const coursesData = {{ courses | tojson }};

    function onCourseChange() {
        const courseId = document.getElementById("course_select").value;
        const selected = coursesData.find(c => c.name === courseId);
        
        if (selected) {
            document.getElementById("description").value = selected.description || "";
            // If they haven't set end time, set duration
            if (!document.getElementById("end_time").value) {
                document.getElementById("duration_hours").value = selected.duration_hours || 0;
            }
        }
    }

    function calculateDuration() {
        const startTime = document.getElementById("start_time").value;
        const endTime = document.getElementById("end_time").value;
        if (!startTime || !endTime) return;
        
        const startParts = startTime.split(":");
        const endParts = endTime.split(":");
        
        let startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
        let endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
        
        if (endMins < startMins) {
            // Assume session crosses midnight (add 24h)
            endMins += 24 * 60;
        }
        
        const diffMins = endMins - startMins;
        const hours = (diffMins / 60).toFixed(2);
        document.getElementById("duration_hours").value = hours;
    }

    function toggleModeFields() {
        const mode = document.getElementById("training_mode").value;
        const linkWrap = document.getElementById("meeting-link-wrapper");
        const locWrap = document.getElementById("location-wrapper");
        
        if (mode === "Online") {
            linkWrap.classList.remove("d-none");
            locWrap.classList.add("d-none");
            document.getElementById("location").required = false;
        } else {
            linkWrap.classList.add("d-none");
            locWrap.classList.remove("d-none");
            document.getElementById("location").required = true;
        }
    }

    function submitSessionForm(e) {
        e.preventDefault();
        
        const course = document.getElementById("course_select").value;
        const training_date = document.getElementById("training_date").value;
        const start_time = document.getElementById("start_time").value;
        const duration_hours = document.getElementById("duration_hours").value;
        const training_mode = document.getElementById("training_mode").value;
        const trainer = document.getElementById("trainer_select").value;
        const meeting_link = document.getElementById("meeting_link").value;
        const location = document.getElementById("location").value;
        const description = document.getElementById("description").value;
        const max_participants = document.getElementById("max_participants").value;
        
        frappe.call({
            method: "training_portal.www.create_training.index.create_new_session",
            args: {
                course,
                training_date,
                start_time,
                duration_hours,
                training_mode,
                trainer,
                meeting_link,
                location,
                description,
                max_participants
            },
            callback: function(r) {
                if (r.message && r.message.status === "success") {
                    frappe.show_alert({message: r.message.message, color: "green"});
                    setTimeout(() => {
                        window.location.href = "/trainer_sessions";
                    }, 1000);
                } else {
                    frappe.msgprint({
                        title: __('Error'),
                        indicator: 'red',
                        message: r.message ? r.message.message : __('Unknown error occurred')
                    });
                }
            }
        });
    }
</script>
{% endblock %}
